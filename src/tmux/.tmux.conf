unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g @color-bg '#011628'
set -g @color-fg '#565F89'
set -g @color-active '#ffffff'
set -g @color-fg-hover '#ffffff'
set -g @color-bg-hover '#143652'
set -g @color-accent '#22e8df'

set -g base-index 1
setw -g pane-base-index 1

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind Left       previous-window
bind h          previous-window
bind Right          next-window
bind l          next-window

set -g mouse on

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g status-style "bg=#{@color-bg},fg=#{@color-fg}"
set -g mode-style "bg=#{@color-bg-hover},fg=#{@color-fg-hover}"

set -g message-command-style "bg=#{@color-bg},fg=#{@color-fg}"
set -g message-style "bg=#{@color-bg},fg=#{@color-fg}"

set -g allow-rename off

set-option -g status-position bottom
set -g status-interval 5

set -g pane-border-style "fg=#{@color-bg}"       
set -g pane-active-border-style "fg=#{@color-accent}"

setw -g window-status-separator ''
setw -g window-status-format "#[fg=#{@color-fg}] #I/#W#[default] "
setw -g window-status-current-format " #I/#[fg=#{@color-active}]#W#[default] "

set -g status-left ""
set -g status-right "\
#[fg=#{?client_prefix,#{@color-accent},#{@color-fg}}]#S#[default] \
#{?client_prefix,\\,/} \
#(date '+%%H:%%M') "

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
