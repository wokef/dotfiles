unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g @color-bg '#000c16'
set -g @color-fg '#143652'
set -g @color-active '#ffffff'
set -g @color-hover '#bcf3ff'
set -g @color-accent '#22e8df'

set -g base-index 1
setw -g pane-base-index 1

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind Left       previous-window
bind h          previous-window
bind Right          next-window
bind l          next-window

set -g mouse on

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g status-style "bg=#{@color-bg},fg=#{@color-fg}"
set -g mode-style "bg=#{@color-fg},fg=#{@color-hover}"

set -g message-command-style "bg=#{@color-bg},fg=#{@color-fg}"
set -g message-style "bg=#{@color-bg},fg=#{@color-fg}"

set -g allow-rename off

set-option -g status-position bottom
set -g status-interval 5

setw -g window-status-separator ''
setw -g window-status-format "#[fg=#{@color-fg}] #I/#W #[default]"
setw -g window-status-current-format "#[fg=#{@color-active}] #I/#W #[default]"

set -g status-left "#[fg=#{@color-bg}]  #[default]"
set -g status-right "#[fg=#{?client_prefix,#{@color-accent},#{@color-fg}}]#S "

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
